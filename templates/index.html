<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>บางกอกทูเดย์ | สำนักข่าวอันดับ 1 ของคนไทย</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- ✅ CSS กลางของ Navbar/Header/Auth -->

    <!-- ✅ CSS ของหน้า index เท่านั้น -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
  </head>

  <body>
    <!-- ✅ Navbar กลาง (รวม Auth Modal + Header + Nav) -->
    {% include "partials/navbar.html" %}

    <main class="container-xl py-4">
      <!-- Logo marquee -->
      <section class="mb-5">
        <div class="d-flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <span class="ad-badge ad-badge-sponsor">ad</span>
            <span class="font-kanit fw-bold text-navy-bkk">สปอนเซอร์</span>
            <span class="small text-muted d-none d-sm-inline">คลิกโลโก้เพื่อไปยังเว็บไซต์พาร์ทเนอร์</span>
          </div>
        </div>

        <div class="logo-marquee">
          <div id="logoTrack" class="logo-track"></div>
        </div>
      </section>

      <!-- Hero -->
      <section class="row g-4 mb-5">
        <div class="col-lg-8">
          <div class="swiper mainSwiper shadow">
            <div class="swiper-wrapper" id="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h3 class="font-kanit fw-bold text-navy-bkk m-0 pb-1 border-bottom border-2 border-bkk-red">ไม่ควรพลาด</h3>
            <span class="small text-muted">อัปเดตล่าสุด</span>
          </div>
          <div id="must-read" class="d-grid gap-3"></div>
        </div>
      </section>


<section class="mt-4 mb-5" id="bigHeroAd"></section>



      <!-- Latest + Popular -->
      <section class="row g-4">
        <div class="col-lg-8">
          <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
            <h2 class="font-kanit fw-bold text-navy-bkk m-0">ข่าวล่าสุด</h2>
          </div>

          <div class="row g-3" id="news-grid"></div>
        </div>

        <aside class="col-lg-4">
          <div class="bg-white p-4 shadow-sm rounded-4 border">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h3 class="font-kanit fw-bold text-navy-bkk m-0">ยอดนิยม</h3>
              <span class="small text-muted">24 ชม.</span>
            </div>
            <div class="d-grid gap-2" id="popular-list"></div>
          </div>
        </aside>
      </section>

      <!-- More + pagination -->
      <section class="mt-5">
        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
          <h2 class="font-kanit fw-bold text-navy-bkk m-0">ข่าวเพิ่มเติม</h2>
          <span class="small text-muted">แสดงแบบ 3 คอลัมน์</span>
        </div>

        <div class="row g-3" id="more-news-grid"></div>

        <div class="d-flex align-items-center justify-content-between gap-3 mt-3 flex-wrap">
          <div class="small text-muted" id="more-pagination-info">—</div>
          <div class="d-flex align-items-center gap-2" id="more-pagination"></div>
        </div>
      </section>

      

      <!-- Watch rail -->
      <section class="mt-5">
        <div class="bbc-divider mb-3"></div>

        <div class="rail">
          <div class="rail-head">
            <div class="d-flex align-items-center gap-2">
              <span class="ad-badge ad-badge-watch">watch</span>
              <div class="font-kanit fw-black fs-5">วิดีโอแนะนำ</div>
            </div>

            <div class="d-flex align-items-center gap-2">
              <button id="watchPrev" class="btn-page" type="button" aria-label="เลื่อนซ้าย">◀</button>
              <button id="watchNext" class="btn-page" type="button" aria-label="เลื่อนขวา">▶</button>
            </div>
          </div>

          <div class="watchSwiper-area">
            <div class="swiper watchSwiper">
              <div class="swiper-wrapper" id="watchWrapper"></div>
            </div>
          </div>
        </div>
      </section>



      <!-- ข่าวตามหมวด -->
      <section class="mt-5">
        <div id="categorySections" class="d-grid gap-5"></div>
      </section>


      <!-- Footer Ads -->
      <section class="mt-5 mb-2">
        <div class="footer-ad-wrap">
          <div class="d-flex align-items-center justify-content-between gap-3 mb-3 flex-wrap">
            <div class="d-flex align-items-center gap-2">
              <span class="ad-badge ad-badge-sponsor">ad</span>
              <div class="font-kanit fw-bold text-navy-bkk">โฆษณาแนะนำ</div>
            </div>
          </div>

          <div class="px-1">
            <div class="swiper footerAdSwiper">
              <div class="swiper-wrapper" id="footerAdWrapper"></div>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-end gap-2 mt-3">
            <button id="adPrev" class="btn-page" type="button" aria-label="เลื่อนซ้าย">◀</button>
            <button id="adNext" class="btn-page" type="button" aria-label="เลื่อนขวา">▶</button>
          </div>
        </div>
      </section>
    </main>

    {% include "partials/footer.html" %}

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- ✅ JS หน้า index เท่านั้น -->
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
</html>
