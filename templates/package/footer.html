<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Footer Slide | Bangkok Today</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Swiper -->
  <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">

  <!-- Theme CSS -->
    <link rel="stylesheet" href="{{url_for ('static',filename='css/advertise.css')}}" />
</head>
<body>

<main class="container-xl py-5">

  <section class="text-center mb-5">
    <h1 class="bt-title">Footer Slide</h1>
    <p class="bt-subtitle">
      แสดงโฆษณาแบบสไลด์ด้านล่างหน้าเว็บ (Auto Slide)
    </p>
  </section>

  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="ad-pack">

        <h3 class="pack-title">Footer Slide</h3>
        <p class="pack-desc">โฆษณาสไลด์อัตโนมัติด้านล่าง</p>
        <div class="pack-price">500 บาท / เดือน</div>

        <input type="file" id="slideImage" class="form-control mb-2" accept="image/*">
        <input type="text" id="slideTitle" class="form-control mb-2" placeholder="หัวข้อโฆษณา">
        <input type="text" id="slideSub" class="form-control mb-2" placeholder="คำอธิบาย">
        <input type="url" id="slideUrl" class="form-control mb-2" placeholder="ลิงก์เว็บไซต์">

        <select id="slideMonth" class="form-select mb-2">
          <option value="1">1 เดือน</option>
          <option value="3">3 เดือน</option>
          <option value="6">6 เดือน</option>
          <option value="12">12 เดือน</option>
        </select>

        <div id="slideTotal" class="total-price"></div>

        <div class="preview-box mt-3">
          <div class="preview-label">พรีวิว</div>
          <div class="swiper footerAdSwiper">
            <div class="swiper-wrapper" id="slidePreview"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="{{ url_for ('static', filename='js/footer-pack.js')}}"></script>
</body>
</html>
