<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>Sidebar Ad | Bangkok Today</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{url_for ('static',filename='css/advertise.css')}}" />
  </head>

  <body>
    <main class="container-xl py-5">

      <div class=" mb-4">
  <a href="{{ url_for('packages.packages_page') }}" class="btn btn-primary shadow-sm">
  ← กลับหน้าแรก
</a>
</div>
      <section class="text-center mb-5">
        <h1 class="bt-title">Sidebar Ad</h1>
        <p class="bt-subtitle">
          โฆษณาแถบข้างในหน้าอ่านข่าว (เห็นตลอดขณะเลื่อน)
        </p>
      </section>

      <div class="row g-4 justify-content-center">
        <!-- FORM -->
        <div class="col-lg-6">
          <div class="ad-pack">
            <h3 class="pack-title">Sidebar Ad</h3>
            <p class="pack-desc">แสดงในหน้าอ่านข่าว ใต้ข่าวเด่น</p>
            <div class="pack-price"
                id="priceBox"
                data-price="{{ price }}">
              {{ price|int }} บาท / เดือน
            </div>

            <input
              type="file"
              id="sideImage"
              class="form-control mb-2"
              accept="image/*"
            />
            <input
              type="text"
              id="sideTitle"
              class="form-control mb-2"
              placeholder="ชื่อแบรนด์"
            />
            <textarea
              id="sideDesc"
              class="form-control mb-2"
              placeholder="รายละเอียดโฆษณา (แสดงใต้ภาพ)"
            ></textarea>

            <input
              type="url"
              id="sideUrl"
              class="form-control mb-2"
              placeholder="ลิงก์เว็บไซต์"
            />

            <select id="sideMonth" class="form-select mb-2">
              <option value="1">1 เดือน</option>
              <option value="3">3 เดือน</option>
              <option value="6">6 เดือน</option>
              <option value="12">12 เดือน</option>
            </select>

            <div id="sideTotal" class="fw-bold text-primary text-center mt-2">
              รวม {{ price }} บาท
            </div>

            <div class="preview-box mt-3">
            <div class="preview-label">พรีวิวตำแหน่งจริง</div>

            <a id="sidePreview" href="#" class="sidebar-ad" target="_blank">
              <div class="sidebar-ad">
                <img src="" alt="">
              </div>
            </a>
          </div>
          <button id="submitSidebarAd" class="btn btn-primary w-100 mt-3">
            ส่งโฆษณา
          </button>

            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="{{ url_for ('static', filename='js/sidebar-pack.js')}}"></script>

    
  </body>
</html>
