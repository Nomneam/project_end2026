<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Hero Ad | Bangkok Today</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{url_for ('static',filename='css/advertise.css')}}" />
</head>

<body>
<main class="container-xl py-5">
 <div class=" mb-4">
  <a href="{{ url_for('packages.packages_page') }}" class="btn btn-danger shadow-sm">
  ← กลับหน้าแรก
</a>
</div>


  <section class="text-center mb-5">
    <h1 class="bt-title">Big Hero Ad</h1>
    <p class="bt-subtitle">
      โฆษณาขนาดใหญ่ เห็นชัดบนหน้าเว็บ
    </p>
  </section>

  <div class="row justify-content-center g-4">
    <div class="col-md-12">
      <div class="ad-pack">

        <h3 class="pack-title">Big Hero Ad</h3>
        <p class="pack-desc">
          เลือกตำแหน่งและตั้งค่าข้อมูลโฆษณา
        </p>

        <!-- เลือกตำแหน่ง -->
        <select id="heroPlace" class="form-select mb-2">
          <option value="home">หน้าแรก</option>
          <option value="category">หน้าหมวดข่าว</option>
        </select>

        <input type="file" id="heroImage" class="form-control mb-2" accept="image/*">
        <input type="text" id="heroTitle" class="form-control mb-2" placeholder="หัวข้อโฆษณา">
        <input type="text" id="heroSub" class="form-control mb-2" placeholder="คำอธิบาย">
        <input type="url" id="heroUrl" class="form-control mb-2" placeholder="ลิงก์เว็บไซต์">

        <select id="heroMonth" class="form-select mb-2">
          <option value="1">1 เดือน</option>
          <option value="3">3 เดือน</option>
          <option value="6">6 เดือน</option>
          <option value="12">12 เดือน</option>
        </select>

        <div id="heroTotal" class="total-price"></div>

        <div class="preview-box mt-3">
        <div class="preview-label">พรีวิวตำแหน่งโฆษณา</div>
        <div id="heroPreview" class="swiper-wrapper"></div>
      </div>
      <button id="submitHeroAd" class="btn btn-bkk-red w-100 mt-3">
        ส่งโฆษณา
      </button>
    </div>
  </div>

  

      </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="{{ url_for ('static', filename='js/bighero-pack.js')}}"></script>
</body>
</html>
