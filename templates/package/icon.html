<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Icon Sponsor | Bangkok Today</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Theme CSS -->
    <link rel="stylesheet" href="{{url_for ('static',filename='css/advertise.css')}}" />
</head>
<body>

<main class="container-xl py-5">

  <section class="text-center mb-5">
    <h1 class="bt-title">Icon Sponsor</h1>
    <p class="bt-subtitle">
      แสดงโลโก้แบรนด์ของคุณในหน้าแรก พร้อมลิงก์ไปเว็บไซต์
    </p>
  </section>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="ad-pack">

        <h3 class="pack-title">Icon Sponsor</h3>
        <p class="pack-desc">โลโก้เลื่อนในหน้า index</p>
        <div class="pack-price">300 บาท / เดือน</div>

        <input type="file" id="iconImage" class="form-control mb-2" accept="image/*">
        <input type="text" id="iconName" class="form-control mb-2" placeholder="ชื่อแบรนด์">
        <input type="url" id="iconUrl" class="form-control mb-2" placeholder="ลิงก์เว็บไซต์">

        <select id="iconMonth" class="form-select mb-2">
          <option value="1">1 เดือน</option>
          <option value="3">3 เดือน</option>
          <option value="6">6 เดือน</option>
          <option value="12">12 เดือน</option>
        </select>

        <div id="iconTotal" class="total-price"></div>

        <div class="preview-box mt-3">
          <div class="preview-label">พรีวิว</div>
          <div class="logo-marquee">
            <div id="iconPreview" class="logo-track"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="{{ url_for('static', filename='js/icon-pack.js')}}"></script>
</body>
</html>
