<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>โฆษณาของฉัน - Bangkok Today</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ads_overview.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />

</head>
<body>
      {% include "partials/navbar.html" %}


  <main class="page-wrapper">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-2">
      <div>
        <div class="section-header-title">โฆษณาของฉัน</div>
        <div class="section-header-subtitle">ดูสรุปแคมเปญโฆษณาที่เคยลงกับ Bangkok Today ทั้งหมดในที่เดียว</div>
      </div>
      <button class="btn btn-danger btn-sm rounded-pill px-3" id="btnNewAd" type="button">
        <i class="bi bi-plus-lg me-1"></i>สร้างแคมเปญใหม่
      </button>
    </div>

    <div class="filter-bar mb-3">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-5">
          <div class="filter-pill-label mb-1">ค้นหาแคมเปญ</div>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="พิมพ์ชื่อแคมเปญหรือแบรนด์" />
        </div>
        <div class="col-6 col-md-3">
          <div class="filter-pill-label mb-1">สถานะ</div>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="">ทั้งหมด</option>
            <option value="running">กำลังรัน</option>
            <option value="pending">รอตรวจ</option>
            <option value="ended">หมดอายุ</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <div class="filter-pill-label mb-1">ลำดับ</div>
          <select id="sortSelect" class="form-select form-select-sm">
            <option value="recent">ล่าสุด</option>
            <option value="impressions">Impressions สูงสุด</option>
            <option value="clicks">Clicks สูงสุด</option>
          </select>
        </div>
      </div>
    </div>

    <div id="adsList" class="d-flex flex-column gap-3"></div>

    <div class="pagination-wrapper d-flex justify-content-between align-items-center" id="paginationWrapper" style="display:none;">
      <div class="small text-muted" id="pageInfo"></div>
      <nav>
        <ul class="pagination mb-0" id="pagination"></ul>
      </nav>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="{{ url_for('static', filename='js/ads-overview.js') }}"></script>
</body>
</html>
