<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>บางกอกทูเดย์ | หมวดข่าว</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/page_category.css') }}"
    />

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>

  <body>
    {% include "partials/navbar.html" %}

    <main class="container-xl py-4">
      <!-- HERO -->
      <section class="cat-hero mb-4">
        <div class="cat-hero-bg"></div>

        <div class="cat-hero-inner">
          <!-- Breadcrumb -->
          <div class="cat-breadcrumb">
            <a href="{{ url_for('index.index_news') }}" class="cat-bc-link">
              <i class="bi bi-house-door"></i>
            </a>
            <span class="cat-bc-sep">›</span>
            <span class="cat-bc-current" id="bcMain">—</span>

            <span class="cat-bc-sub d-none" id="bcSubWrap">
              <span class="cat-bc-sep">›</span>
              <span class="cat-bc-current" id="bcSub">—</span>
            </span>
          </div>

          <!-- Title -->
          <h1 class="cat-title font-kanit text-center m-0">
            <span class="cat-title-line"></span>
            <span id="mainTitle">—</span>
            <span class="cat-title-line"></span>
          </h1>

          <!-- Subtitle -->
          <div class="cat-subtitle-wrap d-none" id="subTitleWrap">
            <div class="cat-subtitle font-kanit" id="subTitle">—</div>
          </div>

          <!-- Sub chips -->
          <div class="cat-chips mt-3" id="subChips"></div>

        
      </section>

<section class="mt-4 mb-5" id="bigCatHeroAd">
  <div class="swiper bigCatHeroAdSwiper">
    <div class="swiper-wrapper" id="bigCatHeroAdWrapper"></div>
  </div>
  <div class="d-flex align-items-center justify-content-end gap-2 mt-3">
    <button id="bigCatHeroAdPrev" class="btn-page" type="button" aria-label="เลื่อนซ้าย">◀</button>
    <button id="bigCatHeroAdNext" class="btn-page" type="button" aria-label="เลื่อนขวา">▶</button>
  </div>
</section>

      <!-- CONTENT -->
      <section>
        <div class="row g-3" id="newsGrid"></div>

        <div
          class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2"
        >
          <div class="small text-muted" id="pageInfo">—</div>
          <div class="d-flex gap-1" id="pagination"></div>
        </div>
      </section>
    </main>

    {% include "partials/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      window.PAGE_STATE = {
        cat_id: "{{ cat_id }}",
        subcat_id: "{{ subcat_id or '' }}",
      };
    </script>
    <script src="{{ url_for('static', filename='js/page_category.js') }}"></script>
  </body>
</html>
