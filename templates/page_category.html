<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>บางกอกทูเดย์ | หมวดข่าว</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/page_category.css') }}"
    />
  </head>

  <body>
    {% include "partials/navbar.html" %}

    <main class="container-xl py-4">
      <!-- HERO -->
      <section class="cat-hero mb-4">
        <div class="cat-hero-bg"></div>

        <div class="cat-hero-inner">
          <!-- Breadcrumb -->
          <div class="cat-breadcrumb">
            <a href="{{ url_for('index.index_news') }}" class="cat-bc-link">
              <i class="bi bi-house-door"></i>
            </a>
            <span class="cat-bc-sep">›</span>
            <span class="cat-bc-current" id="bcMain">—</span>

            <span class="cat-bc-sub d-none" id="bcSubWrap">
              <span class="cat-bc-sep">›</span>
              <span class="cat-bc-current" id="bcSub">—</span>
            </span>
          </div>

          <!-- Title -->
          <h1 class="cat-title font-kanit text-center m-0">
            <span class="cat-title-line"></span>
            <span id="mainTitle">—</span>
            <span class="cat-title-line"></span>
          </h1>

          <!-- Subtitle -->
          <div class="cat-subtitle-wrap d-none" id="subTitleWrap">
            <div class="cat-subtitle font-kanit" id="subTitle">—</div>
          </div>

          <!-- Sub chips -->
          <div class="cat-chips mt-3" id="subChips"></div>

        
      </section>

       <!-- Big Hero Ad -->
<section class="mt-4 mb-5">
  <a href="https://example.com" target="_blank" rel="noopener noreferrer"
     class="big-ad-wrap text-decoration-none">

    <img
      src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80"
      alt="โฆษณา"
      class="big-ad-img"
    />

    <div class="big-ad-overlay"></div>

    <div class="big-ad-content">
      <span class="ad-badge ad-badge-ad mb-2">ad</span>

      <h2 class="font-kanit fw-bold big-ad-title">
        แคมเปญใหญ่ต้นปี 2026
      </h2>

      <p class="big-ad-desc">
        ดีลแรงเฉพาะผู้อ่าน Bangkok Today • วันนี้วันเดียว
      </p>

      <div class="mt-3">
        <span class="btn btn-bkk-red px-4">
          ดูรายละเอียด
        </span>
      </div>
    </div>

  </a>
</section>



      <!-- CONTENT -->
      <section>
        <div class="row g-3" id="newsGrid"></div>

        <div
          class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2"
        >
          <div class="small text-muted" id="pageInfo">—</div>
          <div class="d-flex gap-1" id="pagination"></div>
        </div>
      </section>
    </main>

    <footer class="bg-navy-bkk text-white mt-5">
      <div class="container-xl py-5">
        <div class="display-6 fw-bold fst-italic">
          <span>BANGKOK</span><span class="text-red-bkk">TODAY</span>
        </div>
        <p class="text-white-50 small mt-2 mb-0">
          สำนักข่าวสารที่ส่งตรงความจริงถึงหน้าจอคุณ
        </p>
      </div>
      <div class="bg-black py-3 text-center small text-white-50">
        © 2026 Bangkok Today
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.PAGE_STATE = {
        cat_id: "{{ cat_id }}",
        subcat_id: "{{ subcat_id or '' }}",
      };
    </script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/page_category.js') }}"></script>
  </body>
</html>
