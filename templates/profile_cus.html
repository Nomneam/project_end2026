<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าบัญชี | Bangkok Today</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile_cus.css')}}">
</head>

<body>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-8">

<div class="card profile-card shadow-sm border-0">
<div class="card-body p-4">

<div class="d-flex justify-content-between align-items-center mb-4">
<h4 class="text-navy-bkk fw-bold mb-0">
<i class="bi bi-person-circle me-2"></i>ตั้งค่าบัญชีผู้ใช้
</h4>
<a href="{{ url_for('index.index_news') }}" class="btn btn-outline-secondary btn-sm">
<i class="bi bi-arrow-left"></i> กลับหน้าแรก
</a>
</div>

<!-- ================= FORM START ================= -->
<form id="profileForm" enctype="multipart/form-data">

<div class="text-center mb-4">
<div class="avatar-container position-relative d-inline-block">

{% if user.cus_profile %}
    <img id="avatarPreview"
         class="avatar-preview"
         src="data:image/jpeg;base64,{{ user.cus_profile }}"
         style="display:block;">
    <div id="defaultAvatar" class="default-avatar avatar-bkk" style="display:none;">
        <i class="bi bi-person-circle"></i>
    </div>
{% else %}
    <div id="defaultAvatar" class="default-avatar avatar-bkk">
        <i class="bi bi-person-circle"></i>
    </div>
    <img id="avatarPreview" class="avatar-preview" style="display:none;">
{% endif %}

<label class="btn btn-navy-bkk btn-sm change-avatar-btn position-absolute bottom-0 end-0">
    <i class="bi bi-camera"></i>
    <input type="file" name="avatar" id="avatarInput" hidden accept="image/*">
</label>

</div>

</div>

<div class="mb-4">
<h6 class="text-navy-bkk fw-bold">ข้อมูลส่วนตัว</h6>
<div class="row g-3">

<div class="col-md-6">
<label class="form-label">ชื่อ</label>
<input type="text"
       name="fname"
       class="form-control"
       placeholder="ชื่อ"
       value="{{ user.cus_fname or '' }}"
       data-original="{{ user.cus_fname or '' }}"
       required>
</div>

<div class="col-md-6">
<label class="form-label">นามสกุล</label>
<input type="text"
       name="lname"
       class="form-control"
       placeholder="นามสกุล"
       value="{{ user.cus_lname or '' }}"
       data-original="{{ user.cus_lname or '' }}"
       required>
</div>

<div class="col-md-6">
<label class="form-label">เบอร์โทรศัพท์</label>
<input type="text"
       name="phone"
       class="form-control"
       placeholder="เบอร์โทรศัพท์"
       maxlength="10"
       value="{{ user.cus_phone or '' }}"
       data-original="{{ user.cus_phone or '' }}">
</div>

<div class="col-md-6">
<label class="form-label">รหัสบัตรประชาชน</label>
<input type="text"
       name="citizen_id"
       class="form-control"
       placeholder="รหัสบัตรประชาชน"
       maxlength="13"
       value="{{ user.cus_idcard or '' }}"
       data-original="{{ user.cus_idcard or '' }}">
</div>

<div class="col-12">
<label class="form-label">อีเมล</label>
<input type="email"
       name="email"
       class="form-control"
       placeholder="อีเมล"
       value="{{ user.cus_email or '' }}"
       data-original="{{ user.cus_email or '' }}">
</div>

</div>
</div>

<hr>

<div class="d-flex justify-content-between align-items-center">
<h6 class="text-navy-bkk fw-bold mb-0">
<i class="bi bi-shield-lock me-1"></i>ความปลอดภัย
</h6>
<button type="button" class="btn btn-navy-bkk btn-sm" id="changePasswordBtn">
<i class="bi bi-key"></i> เปลี่ยนรหัสผ่าน
</button>
</div>

<div class="text-end mt-4">
<button type="submit" class="btn btn-navy-bkk px-4">
<i class="bi bi-check-circle"></i> บันทึกข้อมูล
</button>
</div>

</form>
<!-- ================= FORM END ================= -->

</div>
</div>

</div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='js/profile_cus.js')}}"></script>

</body>
</html>
